name: Build single channel images
run-name: >-
  ${{ inputs.channel == 'stable' && 'Stable' || inputs.channel == 'beta' && 'Beta' || 'Dev' }}:
  ${{ inputs.publish && 'release' || 'build' }} from
  ${{ inputs.version_sha && format('version snapshot {0}', inputs.version_sha) || 'latest versions' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Home Assistant release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - dev
      version_sha:
        description: Full commit SHA in home-assistant/version (required to publish)
        type: string
      publish:
        description: Publish a signed GitHub release
        type: boolean
        default: false
      force:
        description: Build even when version inputs are unchanged (does not overwrite published releases)
        type: boolean
        default: false

permissions: {}

# An explicit shell enables pipefail, so a failed gh api call fails the step
defaults:
  run:
    shell: bash

concurrency:
  group: full-images-${{ inputs.publish && inputs.channel || github.run_id }}
  queue: max

jobs:
  resolve-matrix:
    name: Resolve build matrix for channel ${{ inputs.channel }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download version snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          VERSION_SHA: ${{ inputs.version_sha }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main && "$CHANNEL" != dev && -n "$VERSION_SHA" ]] || {
              echo "::error::Publishing requires main, stable or beta, and version_sha"
              exit 1
            }
          fi
          mkdir -p release-inputs
          url="https://version.home-assistant.io/$CHANNEL.json"
          if [[ -n "$VERSION_SHA" ]]; then
            [[ "$VERSION_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::version_sha must be a full 40-character commit SHA"
              exit 1
            }
            branch=$(gh api repos/home-assistant/version --jq .default_branch)
            status=$(gh api "repos/home-assistant/version/compare/$branch...$VERSION_SHA" --jq .status)
            [[ "$status" == behind || "$status" == identical ]] || {
              echo "::error::version_sha must be on home-assistant/version's $branch branch"
              exit 1
            }
            url="https://raw.githubusercontent.com/home-assistant/version/$VERSION_SHA/$CHANNEL.json"
          fi
          curl -fsSL --retry 3 "$url" -o "release-inputs/$CHANNEL.json"
          jq -e --arg channel "$CHANNEL" '.channel == $channel' "release-inputs/$CHANNEL.json"

      - name: Resolve boards and source image URLs
        id: matrix
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          echo "::group::Generate build matrix for channel=${CHANNEL}"
          version_file="release-inputs/${CHANNEL}.json"

          matrix_json="$(jq -c --arg os_name "haos" '
            [
              . as $root                                  # Keep full payload for .ota template
              | .hassos                                   # Board -> HAOS version map
              | to_entries[]                              # Iterate board/version pairs
              | .key as $board
              | .value as $version
              | (                                       # Get image URL from ota template, replacing placeholders
                  $root.ota
                  | gsub("\\{os_name\\}"; $os_name)     # Replace {os_name}
                  | gsub("\\{board\\}"; $board)         # Replace {board} by entry key
                  | gsub("\\{version\\}"; $version)     # Replace {version} by entry value
                  | if $board == "ova"                  # Change OTA filename suffix to appropriate image suffix
                    then gsub("raucb$"; "qcow2.xz")
                    else gsub("raucb$"; "img.xz")
                    end
                ) as $image_url
              | {                                       # Format matrix entry
                  board: $board,
                  version: $version,
                  image_url: $image_url,
                  filename: ($image_url | split("/") | last)
                }
            ]
            | sort_by(.board)
          ' "$version_file")"

          {
            echo "matrix<<EOF"
            echo "$matrix_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Print resolved build matrix"
          jq . <<< "$matrix_json"
          echo "::endgroup::"

      - name: Skip published tags and unchanged inputs
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          VERSION_SHA: ${{ inputs.version_sha }}
          PUBLISH: ${{ inputs.publish }}
          FORCE: ${{ inputs.force }}
        run: |
          # Keep only fields used by the boards being built.
          source scripts/lib.sh
          machines=$(while read -r board; do
            get_machine "$board"
          done < <(jq -r '.hassos | keys[]' "release-inputs/$CHANNEL.json") | jq -Rsc 'split("\n")[:-1]')
          jq -S --argjson machines "$machines" '
            {
              hassos, ota, supervisor, dns, audio, cli, multicast, observer,
              homeassistant: (.homeassistant | with_entries(select(.key as $key | $machines | index($key)))),
              images: (.images | {core, supervisor, dns, audio, cli, multicast, observer})
            }
          ' "release-inputs/$CHANNEL.json" > release-inputs/build-inputs.json

          build=true
          if [[ "$PUBLISH" == true ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[]' | \
              jq -s --arg channel "$CHANNEL" '[.[] | select(.draft == false and (.tag_name | startswith($channel + "-")))] | sort_by(.published_at) | reverse' > releases.json
            if jq -e --arg tag "$CHANNEL-$VERSION_SHA" 'any(.[]; .tag_name == $tag)' releases.json; then
              echo "::notice::Skipping build: release $CHANNEL-$VERSION_SHA is already published"
              build=false
            elif [[ "$FORCE" != true && "$(jq length releases.json)" != 0 ]]; then
              previous=$(jq -r '.[0].tag_name' releases.json)
              if gh release download "$previous" --pattern build-inputs.json --dir previous &&
                cmp -s previous/build-inputs.json release-inputs/build-inputs.json; then
                echo "::notice::Skipping build: bundled versions are unchanged from $previous"
                build=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Upload shared snapshot
        if: steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs
          path: release-inputs/*
          if-no-files-found: error

  draft:
    name: Create or resume draft release
    needs: resolve-matrix
    if: inputs.publish && needs.resolve-matrix.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      release_id: ${{ steps.draft.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: release-inputs

      - name: Create or resume draft release
        id: draft
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_SHA: ${{ inputs.version_sha }}
        run: |
          tag="$CHANNEL-$VERSION_SHA"
          versions=release-inputs/build-inputs.json
          core=$(jq -r '.homeassistant | [.[]] | unique | join(", ")' "$versions")
          os=$(jq -r '.hassos | [.[]] | unique | join(", ")' "$versions")
          title="Home Assistant $core / OS $os (${CHANNEL^} full images)"
          {
            echo "Home Assistant OS images with preloaded Home Assistant components for offline installation."
            echo
            echo '## Included components'
            echo
            echo '| Component | Version |'
            echo '| --- | --- |'
            jq -r '
              def releases($repo):
                unique | map("[\(.)](https://github.com/home-assistant/\($repo)/releases/tag/\(.))") | join(", ");
              [
                ["Home Assistant OS", ([.hassos[]] | releases("operating-system"))],
                ["Home Assistant Core", ([.homeassistant[]] | releases("core"))],
                ["Supervisor", ([.supervisor] | releases("supervisor"))],
                ["DNS", ([.dns] | releases("plugin-dns"))],
                ["Audio", ([.audio] | releases("plugin-audio"))],
                ["CLI", ([.cli] | releases("cli"))],
                ["Multicast", ([.multicast] | releases("plugin-multicast"))],
                ["Observer", ([.observer] | releases("plugin-observer"))]
              ][] | "| \(.[0]) | \(.[1]) |"
            ' "$versions"
            echo
            echo '## Build details'
            echo
            echo "- Channel: **${CHANNEL^}**"
            echo "- Version snapshot: [$VERSION_SHA](https://github.com/home-assistant/version/commit/$VERSION_SHA)"
            echo "- Builder: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
          } > release-notes.md
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[]' | \
            jq -s --arg tag "$tag" '[.[] | select(.tag_name == $tag)][0]' > release.json
          resume=false
          if [[ "$(jq -r .id release.json)" != null ]]; then
            # Never alter an already published release.
            jq -e '.draft == true' release.json
            resume=true
          fi
          # GITHUB_TOKEN can't create a release with --target (needs the workflows
          # permission), so create the tag through the refs API first.
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              if [[ "$resume" != true ]]; then
                echo "::error::Tag $tag points to $tag_sha, not $GITHUB_SHA. Delete it first."
                exit 1
              fi
              # The tag of a resumed draft must point to the builder commit of this run
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          if [[ "$resume" != true ]]; then
            # Use the API response, as a new draft may not be listed yet.
            gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" \
              -f name="$title" \
              -F body=@release-notes.md -F draft=true > release.json
          else
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
            while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done < <(jq -r '.assets[].name' release.json)
          fi
          release_id=$(jq -er .id release.json)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build images for ${{ matrix.board }} version ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload images to the draft release when publishing
    needs: [resolve-matrix, draft]
    if: >-
      !cancelled() && needs.resolve-matrix.outputs.build == 'true' &&
      (needs.draft.result == 'success' || (!inputs.publish && needs.draft.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: input

      - name: Download HAOS input image
        env:
          IMAGE_URL: ${{ matrix.image_url }}
          FILENAME: ${{ matrix.filename }}
        run: |
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 \
            -o "input/$FILENAME" \
            "$IMAGE_URL"

      - name: Build full image
        env:
          FILENAME: ${{ matrix.filename }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          make docker-image
          make build IMAGE="$FILENAME" CHANNEL="$CHANNEL" VERSION_FILE="/input/$CHANNEL.json"

      - name: Add Core version and revision to filenames
        env:
          BOARD: ${{ matrix.board }}
          CHANNEL: ${{ inputs.channel }}
          VERSION_SHA: ${{ inputs.version_sha }}
        run: |
          source scripts/lib.sh
          core=$(jq -er --arg machine "$(get_machine "$BOARD")" '.homeassistant[$machine]' "input/$CHANNEL.json")
          revision="${VERSION_SHA:0:12}"
          revision="${revision:-manual-$GITHUB_RUN_ID}"
          for src in output/haos_*-full.*; do
            mv "$src" "${src/-full./-full-core-$core-$CHANNEL-$revision.}"
          done
          ls -lh output

      - name: Compute image digests
        if: inputs.publish
        working-directory: output
        env:
          BOARD: ${{ matrix.board }}
        run: sha256sum haos_* > "SHA256SUMS.$BOARD"

      - name: Upload image digests artifact
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums-${{ matrix.board }}
          path: output/SHA256SUMS.${{ matrix.board }}
          if-no-files-found: error

      - name: Upload images to draft release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" output/haos_* --clobber

      - name: Detect output formats
        if: ${{ !inputs.publish }}
        id: formats
        run: |
          shopt -s nullglob
          for ext in img.xz qcow2.xz vmdk.zip vdi.zip vhdx.zip ova; do
            files=(output/haos_*.$ext)
            if [ "${#files[@]}" -gt 0 ]; then
              echo "has_${ext%%.*}=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Upload raw image
        if: steps.formats.outputs.has_img == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: output/haos_*.img.xz
          if-no-files-found: error

      - name: Upload QCOW2 image
        if: steps.formats.outputs.has_qcow2 == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: output/haos_*.qcow2.xz
          if-no-files-found: error

      - name: Upload VMDK image
        if: steps.formats.outputs.has_vmdk == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: output/haos_*.vmdk.zip
          if-no-files-found: error

      - name: Upload VDI image
        if: steps.formats.outputs.has_vdi == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: output/haos_*.vdi.zip
          if-no-files-found: error

      - name: Upload VHDX image
        if: steps.formats.outputs.has_vhdx == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: output/haos_*.vhdx.zip
          if-no-files-found: error

      - name: Upload OVA image
        if: steps.formats.outputs.has_ova == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: output/haos_*.ova
          if-no-files-found: error

  release:
    name: Sign and publish release
    needs: [resolve-matrix, draft, build]
    if: inputs.publish && needs.resolve-matrix.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.draft.outputs.tag }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: release-assets

      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sha256sums-*
          merge-multiple: true

      - name: Merge image digests
        run: |
          (cd release-assets && sha256sum *.json) > SHA256SUMS.inputs
          cat SHA256SUMS.* | LC_ALL=C sort -k 2 > release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digests
        working-directory: release-assets
        run: cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.sigstore.json

      - name: Publish complete release
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_SHA: ${{ inputs.version_sha }}
        run: |
          gh release upload "$TAG" release-assets/* --clobber
          # Check that the draft holds exactly the signed assets, using the
          # SHA-256 digests GitHub computed for the uploaded files.
          {
            cat release-assets/SHA256SUMS
            (cd release-assets && sha256sum SHA256SUMS SHA256SUMS.sigstore.json)
          } | LC_ALL=C sort -k 2 > expected-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' | \
            LC_ALL=C sort -k 2 > uploaded-assets
          diff -u expected-assets uploaded-assets
          latest=false
          prerelease=true
          if [[ "$CHANNEL" == stable ]]; then
            prerelease=false
            latest=true
            previous=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            if [[ "$previous" =~ ^stable-[0-9a-f]{40}$ ]]; then
              status=$(gh api "repos/home-assistant/version/compare/${previous#stable-}...$VERSION_SHA" --jq .status)
              if [[ "$status" != ahead && "$status" != identical ]]; then
                latest=false
              fi
            fi
          fi
          gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
